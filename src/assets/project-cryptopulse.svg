<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#142646" />
    </linearGradient>
    <filter id="cpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cpBg)" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="55" fill="#122340" />
  <line x1="0" y1="55" x2="800" y2="55" stroke="#1F3660" stroke-width="1" />
  <circle cx="40" cy="27" r="12" fill="#00B4D8" />
  <text x="65" y="34" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CryptoPulse Terminal</text>

  <!-- Live Market Bar -->
  <rect x="250" y="16" width="130" height="24" rx="6" fill="#1E3357" />
  <text x="260" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">BTC/USDT</text>
  <text x="325" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981" font-weight="bold">$68,450</text>

  <rect x="390" y="16" width="130" height="24" rx="6" fill="#1E3357" />
  <text x="400" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">ETH/USDT</text>
  <text x="465" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981" font-weight="bold">$3,820</text>

  <!-- Candlestick / Order Chart Section -->
  <g filter="url(#cpShadow)">
    <rect x="40" y="75" width="480" height="395" rx="14" fill="#122340" stroke="#1F3660" />
    <text x="65" y="105" font-family="'Kanit', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">BTC/USDT 15m Real-time Feed</text>
    
    <!-- Candlesticks mockup -->
    <!-- Green bars -->
    <line x1="100" y1="260" x2="100" y2="340" stroke="#10B981" stroke-width="2" />
    <rect x="92" y="280" width="16" height="40" fill="#10B981" rx="2" />

    <line x1="140" y1="240" x2="140" y2="310" stroke="#10B981" stroke-width="2" />
    <rect x="132" y="250" width="16" height="45" fill="#10B981" rx="2" />

    <!-- Red bar -->
    <line x1="180" y1="250" x2="180" y2="320" stroke="#EF4444" stroke-width="2" />
    <rect x="172" y="260" width="16" height="35" fill="#EF4444" rx="2" />

    <line x1="220" y1="210" x2="220" y2="290" stroke="#10B981" stroke-width="2" />
    <rect x="212" y="220" width="16" height="50" fill="#10B981" rx="2" />

    <line x1="260" y1="180" x2="260" y2="250" stroke="#10B981" stroke-width="2" />
    <rect x="252" y="190" width="16" height="40" fill="#10B981" rx="2" />

    <line x1="300" y1="170" x2="300" y2="230" stroke="#EF4444" stroke-width="2" />
    <rect x="292" y="180" width="16" height="30" fill="#EF4444" rx="2" />

    <line x1="340" y1="140" x2="340" y2="210" stroke="#10B981" stroke-width="2" />
    <rect x="332" y="150" width="16" height="45" fill="#10B981" rx="2" />

    <line x1="380" y1="130" x2="380" y2="190" stroke="#10B981" stroke-width="2" />
    <rect x="372" y="140" width="16" height="35" fill="#10B981" rx="2" />

    <line x1="420" y1="120" x2="420" y2="170" stroke="#10B981" stroke-width="2" />
    <rect x="412" y="130" width="16" height="30" fill="#10B981" rx="2" />

    <line x1="460" y1="110" x2="460" y2="160" stroke="#10B981" stroke-width="2" />
    <rect x="452" y="115" width="16" height="35" fill="#10B981" rx="2" />

    <!-- Moving Average Lines -->
    <path d="M 80 320 Q 200 240 320 180 T 480 120" fill="none" stroke="#00B4D8" stroke-width="2.5" />
    <path d="M 80 340 Q 200 280 320 220 T 480 150" fill="none" stroke="#F59E0B" stroke-width="1.8" />
  </g>

  <!-- Right Order Book & Depth -->
  <g filter="url(#cpShadow)">
    <rect x="540" y="75" width="220" height="395" rx="14" fill="#122340" stroke="#1F3660" />
    <text x="560" y="105" font-family="'Kanit', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Order Book (Depth)</text>
    
    <!-- Asks (Red) -->
    <rect x="560" y="125" width="120" height="18" fill="rgba(239, 68, 68, 0.15)" rx="4" />
    <text x="565" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EF4444">68,490.50</text>
    <text x="740" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">1.450 BTC</text>

    <rect x="560" y="150" width="150" height="18" fill="rgba(239, 68, 68, 0.15)" rx="4" />
    <text x="565" y="163" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EF4444">68,485.00</text>
    <text x="740" y="163" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">2.120 BTC</text>

    <rect x="560" y="175" width="90" height="18" fill="rgba(239, 68, 68, 0.15)" rx="4" />
    <text x="565" y="188" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EF4444">68,460.00</text>
    <text x="740" y="188" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">0.880 BTC</text>

    <!-- Mid Price -->
    <rect x="560" y="210" width="180" height="32" rx="6" fill="#1E3357" />
    <text x="650" y="231" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">$68,450.00 ↗</text>

    <!-- Bids (Green) -->
    <rect x="560" y="255" width="160" height="18" fill="rgba(16, 185, 129, 0.15)" rx="4" />
    <text x="565" y="268" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">68,445.00</text>
    <text x="740" y="268" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">2.340 BTC</text>

    <rect x="560" y="280" width="110" height="18" fill="rgba(16, 185, 129, 0.15)" rx="4" />
    <text x="565" y="293" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">68,430.00</text>
    <text x="740" y="293" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">1.190 BTC</text>

    <rect x="560" y="305" width="175" height="18" fill="rgba(16, 185, 129, 0.15)" rx="4" />
    <text x="565" y="318" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">68,410.00</text>
    <text x="740" y="318" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">3.510 BTC</text>

    <!-- Quick action buttons -->
    <rect x="560" y="375" width="85" height="38" rx="8" fill="#10B981" />
    <text x="602" y="399" font-family="'Kanit', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ซื้อ (BUY)</text>
    <rect x="655" y="375" width="85" height="38" rx="8" fill="#EF4444" />
    <text x="697" y="399" font-family="'Kanit', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ขาย (SELL)</text>
  </g>
</svg>
