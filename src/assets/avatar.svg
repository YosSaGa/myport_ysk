<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F2FF" />
      <stop offset="50%" stop-color="#C5E0FB" />
      <stop offset="100%" stop-color="#8EBEF5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#1E5FA8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5" />
      <stop offset="100%" stop-color="#F5B88E" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5FA8" />
      <stop offset="100%" stop-color="#0F3767" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1E5FA8" flood-opacity="0.25" />
    </filter>
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#4A90E2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base & Soft Aura -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />
  <circle cx="250" cy="220" r="180" fill="url(#auraGlow)" />

  <!-- Geometric Tech Grid Overlay Background -->
  <g opacity="0.15" stroke="#1E5FA8" stroke-width="1.5">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="0" y1="80" x2="500" y2="80" />
    <line x1="0" y1="180" x2="500" y2="180" />
    <line x1="0" y1="280" x2="500" y2="280" />
    <line x1="0" y1="380" x2="500" y2="380" />
  </g>

  <!-- Glowing Floating Nodes -->
  <circle cx="80" cy="120" r="6" fill="#00B4D8" />
  <circle cx="420" cy="140" r="8" fill="#4A90E2" />
  <circle cx="400" cy="380" r="7" fill="#00B4D8" />
  <circle cx="90" cy="400" r="5" fill="#1E5FA8" />

  <!-- Code Tag Floating Badges -->
  <g filter="url(#softShadow)">
    <rect x="50" y="240" width="85" height="34" rx="10" fill="#ffffff" opacity="0.95" />
    <text x="92" y="262" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#1E5FA8" text-anchor="middle">&lt;React /&gt;</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="365" y="220" width="85" height="34" rx="10" fill="#ffffff" opacity="0.95" />
    <text x="407" y="242" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00B4D8" text-anchor="middle">{ motion }</text>
  </g>

  <!-- Developer Character -->
  <g filter="url(#softShadow)">
    <!-- Body / Hoodie -->
    <path d="M120 480 C120 370 180 340 250 340 C320 340 380 370 380 480 Z" fill="url(#clothGrad)" />
    
    <!-- Hoodie Inner Collar / Tee -->
    <path d="M210 345 L250 395 L290 345 C275 355 225 355 210 345 Z" fill="#ffffff" />
    <path d="M225 355 L250 388 L275 355 Z" fill="#E8F2FF" />

    <!-- Neck -->
    <rect x="225" y="270" width="50" height="80" rx="10" fill="url(#skinGrad)" />
    <ellipse cx="250" cy="330" rx="25" ry="10" fill="#E8A375" opacity="0.4" />

    <!-- Head / Ears -->
    <circle cx="178" cy="225" r="15" fill="url(#skinGrad)" />
    <circle cx="322" cy="225" r="15" fill="url(#skinGrad)" />
    
    <!-- Head Base -->
    <ellipse cx="250" cy="220" rx="72" ry="85" fill="url(#skinGrad)" />

    <!-- Hair (Modern Stylish Fade Cut) -->
    <path d="M178 190 C175 140 210 110 250 110 C290 110 325 140 322 190 C310 180 295 185 280 180 C265 175 235 175 220 180 C200 185 188 180 178 190 Z" fill="#202A36" />
    <path d="M175 185 C170 215 172 235 178 245 L182 200 Z" fill="#202A36" />
    <path d="M325 185 C330 215 328 235 322 245 L318 200 Z" fill="#202A36" />

    <!-- Eyebrows -->
    <path d="M205 195 Q222 188 232 196" fill="none" stroke="#202A36" stroke-width="4.5" stroke-linecap="round" />
    <path d="M268 196 Q278 188 295 195" fill="none" stroke="#202A36" stroke-width="4.5" stroke-linecap="round" />

    <!-- Modern Tech Glasses (Cyan/Blue Rim) -->
    <rect x="195" y="202" width="46" height="34" rx="8" fill="none" stroke="#1E5FA8" stroke-width="4" />
    <rect x="259" y="202" width="46" height="34" rx="8" fill="none" stroke="#1E5FA8" stroke-width="4" />
    <line x1="241" y1="216" x2="259" y2="216" stroke="#1E5FA8" stroke-width="4" />
    <!-- Glasses Glare -->
    <line x1="202" y1="210" x2="214" y2="228" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="266" y1="210" x2="278" y2="228" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Eyes Behind Glasses -->
    <circle cx="218" cy="219" r="6" fill="#1A2B3C" />
    <circle cx="282" cy="219" r="6" fill="#1A2B3C" />
    <circle cx="220" cy="217" r="2" fill="#ffffff" />
    <circle cx="284" cy="217" r="2" fill="#ffffff" />

    <!-- Nose -->
    <path d="M246 228 Q250 242 254 242" fill="none" stroke="#DE986B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Friendly Smile -->
    <path d="M232 256 Q250 274 268 256" fill="none" stroke="#A75836" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cheerful Blushes -->
    <ellipse cx="198" cy="242" rx="10" ry="6" fill="#FF8A8A" opacity="0.35" />
    <ellipse cx="302" cy="242" rx="10" ry="6" fill="#FF8A8A" opacity="0.35" />

    <!-- Modern Wireless Headphones Around Neck -->
    <path d="M165 290 Q250 330 335 290" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="round" />
    <rect x="150" y="270" width="22" height="42" rx="10" fill="#1E5FA8" />
    <rect x="328" y="270" width="22" height="42" rx="10" fill="#1E5FA8" />
  </g>
</svg>
