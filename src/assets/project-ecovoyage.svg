<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F9F6" />
      <stop offset="100%" stop-color="#E2F1EC" />
    </linearGradient>
    <linearGradient id="evCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5FA8" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="evShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10B981" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#evBg)" />

  <!-- Mobile Screen 1: App Itinerary & Eco Score -->
  <g transform="translate(140, 40)" filter="url(#evShadow)">
    <!-- Phone frame -->
    <rect width="240" height="420" rx="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <!-- Dynamic island notch -->
    <rect x="85" y="12" width="70" height="18" rx="9" fill="#1E293B" />
    
    <!-- Mobile App Header -->
    <text x="25" y="55" font-family="'Kanit', sans-serif" font-size="12" fill="#10B981" font-weight="600">ECO VOYAGE</text>
    <text x="25" y="78" font-family="'Kanit', sans-serif" font-size="18" fill="#1E293B" font-weight="700">สำรวจเชียงใหม่ 3D2N</text>

    <!-- Eco Gauge Card -->
    <rect x="20" y="95" width="200" height="85" rx="14" fill="url(#evCard)" />
    <text x="35" y="120" font-family="'Kanit', sans-serif" font-size="11" fill="#E2F1EC">ดัชนีคาร์บอน (Eco Score)</text>
    <text x="35" y="152" font-family="'Kanit', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">94<tspan font-size="14">/100</tspan></text>
    <circle cx="180" cy="138" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
    <circle cx="180" cy="138" r="22" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="110 30" stroke-linecap="round" />

    <!-- Timeline Activity 1 -->
    <rect x="20" y="195" width="200" height="55" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="45" cy="222" r="14" fill="#E8F9F0" />
    <text x="45" y="227" font-family="'Kanit', sans-serif" font-size="14" fill="#10B981" text-anchor="middle">🚲</text>
    <text x="70" y="218" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#1E293B">ปั่นจักรยานคูเมือง</text>
    <text x="70" y="235" font-family="'Sarabun', sans-serif" font-size="10" fill="#64748B">ลดคาร์บอน 4.2 kg CO2</text>

    <!-- Timeline Activity 2 -->
    <rect x="20" y="260" width="200" height="55" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="45" cy="287" r="14" fill="#E8F2FF" />
    <text x="45" y="292" font-family="'Kanit', sans-serif" font-size="14" fill="#1E5FA8" text-anchor="middle">🏡</text>
    <text x="70" y="283" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#1E293B">โฮมสเตย์ชุมชนแม่กำปอง</text>
    <text x="70" y="300" font-family="'Sarabun', sans-serif" font-size="10" fill="#64748B">Green Certified Hotel</text>

    <!-- Action button -->
    <rect x="20" y="350" width="200" height="42" rx="12" fill="#10B981" />
    <text x="120" y="376" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">เริ่มการเดินทางสีเขียว</text>
  </g>

  <!-- Mobile Screen 2: Map & Navigation View -->
  <g transform="translate(420, 60)" filter="url(#evShadow)">
    <rect width="240" height="400" rx="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <!-- Dynamic island notch -->
    <rect x="85" y="12" width="70" height="18" rx="9" fill="#1E293B" />
    
    <!-- Map Mockup Background -->
    <rect x="15" y="45" width="210" height="230" rx="16" fill="#E8F4F0" />
    <!-- Map roads and green patches -->
    <path d="M 30 70 Q 120 120 190 60" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <path d="M 60 160 Q 100 80 180 170" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <!-- Map route in green -->
    <path d="M 40 180 Q 90 120 140 140 T 190 90" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="6,4" />
    <!-- Pin -->
    <circle cx="190" cy="90" r="10" fill="#10B981" />
    <circle cx="190" cy="90" r="4" fill="#FFFFFF" />

    <!-- Station Info Card -->
    <rect x="20" y="290" width="200" height="85" rx="14" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="35" y="315" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#1E293B">EV Charging Station</text>
    <text x="35" y="335" font-family="'Sarabun', sans-serif" font-size="11" fill="#64748B">ระยะทาง 1.8 กม. • ว่าง 4 หัวชาร์จ</text>
    <rect x="35" y="345" width="70" height="20" rx="6" fill="#E8F9F0" />
    <text x="70" y="358" font-family="'Kanit', sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">พลังงานแสงอาทิตย์</text>
  </g>
</svg>
