<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ahBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F8FF" />
    </linearGradient>
    <filter id="ahShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E5FA8" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ahBg)" />

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#FFFFFF" />
  <line x1="0" y1="60" x2="800" y2="60" stroke="#E5EDF6" stroke-width="1" />
  <circle cx="45" cy="30" r="14" fill="#00B4D8" />
  <path d="M45 22 L45 38 M37 30 L53 30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <text x="70" y="37" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#1E5FA8">AuraHealth</text>

  <!-- Status pill -->
  <rect x="630" y="18" width="130" height="26" rx="13" fill="#E8F9F0" />
  <circle cx="645" cy="31" r="4" fill="#10B981" />
  <text x="695" y="35" font-family="'Kanit', sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">ระบบพร้อมใช้งาน</text>

  <!-- Left Column: Doctor Video Consultation Preview -->
  <g filter="url(#ahShadow)">
    <rect x="45" y="85" width="460" height="375" rx="18" fill="#1A2B3C" />
    <!-- Video background gradient -->
    <rect x="45" y="85" width="460" height="375" rx="18" fill="url(#ahBg)" opacity="0.1" />
    <!-- Doctor visual placeholder -->
    <circle cx="275" cy="230" r="65" fill="#4A90E2" opacity="0.8" />
    <path d="M 215 350 C 215 300 245 285 275 285 C 305 285 335 300 335 350 Z" fill="#E8F2FF" />
    
    <!-- Video overlay UI -->
    <rect x="70" y="110" width="130" height="30" rx="8" fill="rgba(0,0,0,0.5)" />
    <circle cx="85" cy="125" r="5" fill="#FF4757" />
    <text x="135" y="129" font-family="'Kanit', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">LIVE 14:28</text>

    <!-- Call controls bar -->
    <rect x="175" y="400" width="200" height="42" rx="21" fill="rgba(255,255,255,0.2)" backdrop-filter="blur(10px)" />
    <circle cx="215" cy="421" r="14" fill="#FFFFFF" />
    <circle cx="275" cy="421" r="14" fill="#FFFFFF" />
    <circle cx="335" cy="421" r="14" fill="#FF4757" />
  </g>

  <!-- Right Column: Medical Summary & Appointments -->
  <g filter="url(#ahShadow)">
    <rect x="525" y="85" width="235" height="175" rx="16" fill="#FFFFFF" stroke="#E2EBF5" />
    <text x="545" y="118" font-family="'Kanit', sans-serif" font-size="14" font-weight="600" fill="#1A2B3C">ข้อมูลผู้ป่วย (Patient)</text>
    <rect x="545" y="135" width="195" height="1" fill="#E2EBF5" />
    <text x="545" y="160" font-family="'Sarabun', sans-serif" font-size="13" fill="#5A6B7D">ความดันโลหิต:</text>
    <text x="725" y="160" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#1E5FA8" text-anchor="end">120/80 mmHg</text>
    <text x="545" y="190" font-family="'Sarabun', sans-serif" font-size="13" fill="#5A6B7D">อัตราการเต้นหัวใจ:</text>
    <text x="725" y="190" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#00B4D8" text-anchor="end">72 bpm</text>
    <text x="545" y="220" font-family="'Sarabun', sans-serif" font-size="13" fill="#5A6B7D">ออกซิเจนในเลือด:</text>
    <text x="725" y="220" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#10B981" text-anchor="end">99% SpO2</text>
    <rect x="545" y="235" width="195" height="8" rx="4" fill="#E8F2FF" />
    <rect x="545" y="235" width="165" height="8" rx="4" fill="#4A90E2" />
  </g>

  <g filter="url(#ahShadow)">
    <rect x="525" y="280" width="235" height="180" rx="16" fill="#FFFFFF" stroke="#E2EBF5" />
    <text x="545" y="312" font-family="'Kanit', sans-serif" font-size="14" font-weight="600" fill="#1A2B3C">ตารางนัดแพทย์ (Next)</text>
    <rect x="545" y="330" width="195" height="55" rx="10" fill="#F4F9FF" stroke="#E2EBF5" />
    <text x="560" y="352" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#1E5FA8">นพ. ธนกฤต วงศ์สว่าง</text>
    <text x="560" y="370" font-family="'Sarabun', sans-serif" font-size="11" fill="#5A6B7D">อายุรกรรม • 28 ก.ย. 10:00 น.</text>
    
    <rect x="545" y="400" width="195" height="42" rx="10" fill="#00B4D8" />
    <text x="642" y="426" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ดูประวัติการรักษาทั้งหมด</text>
  </g>
</svg>
