<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="sfWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#4A90E2" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="sfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sfBg)" />
  <circle cx="400" cy="250" r="220" fill="url(#sfGlow)" />

  <!-- Navbar -->
  <text x="60" y="45" font-family="'Kanit', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">SORA<tspan fill="#00B4D8">FLOW</tspan></text>
  <rect x="620" y="28" width="120" height="30" rx="15" fill="none" stroke="#00B4D8" stroke-width="1.5" />
  <text x="680" y="48" font-family="'Kanit', sans-serif" font-size="12" fill="#00B4D8" font-weight="600" text-anchor="middle">LET'S TALK</text>

  <!-- Dynamic Abstract Motion Wave Ribbon -->
  <path d="M 50 340 C 200 480 300 120 500 280 C 650 380 720 180 800 240 L 800 500 L 0 500 Z" fill="url(#sfWave)" opacity="0.3" />
  <path d="M 0 310 C 220 420 320 140 520 260 C 680 360 720 220 800 190" fill="none" stroke="url(#sfWave)" stroke-width="6" stroke-linecap="round" />
  <path d="M 0 330 C 240 440 340 160 540 280 C 700 380 740 240 800 210" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,6" />

  <!-- Hero Typography -->
  <text x="60" y="150" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#00B4D8" letter-spacing="3">DIGITAL DESIGN &amp; MOTION LAB</text>
  <text x="60" y="210" font-family="'Kanit', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">WE CRAFT</text>
  <text x="60" y="265" font-family="'Kanit', sans-serif" font-size="46" font-weight="800" fill="url(#sfWave)">FLUID EXPERIENCES.</text>

  <!-- Interactive Floating Metric Badges -->
  <g transform="translate(60, 310)">
    <rect width="180" height="60" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="20" y="32" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Awwwards</text>
    <text x="20" y="48" font-family="'Kanit', sans-serif" font-size="11" fill="#94A3B8">Site of the Day Winner</text>
  </g>

  <g transform="translate(260, 310)">
    <rect width="180" height="60" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="20" y="32" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#00B4D8">60 FPS</text>
    <text x="20" y="48" font-family="'Kanit', sans-serif" font-size="11" fill="#94A3B8">Silk-smooth Physics</text>
  </g>

  <!-- Floating 3D Geometric Ring -->
  <ellipse cx="660" cy="220" rx="70" ry="25" fill="none" stroke="#00B4D8" stroke-width="4" transform="rotate(-25 660 220)" />
  <ellipse cx="660" cy="220" rx="45" ry="16" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(-25 660 220)" opacity="0.6" />
</svg>
